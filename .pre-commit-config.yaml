repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: 'v5.0.0'
      hooks:
          - id: check-byte-order-marker
          - id: check-json
          - id: check-toml
          - id: check-xml
          - id: check-yaml
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.14  # Should match the version in requirements-dev.in
      hooks:
          - id: ruff-check
          - id: ruff-format
            args: ["--check"]
